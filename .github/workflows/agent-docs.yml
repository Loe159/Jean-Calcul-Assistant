name: Agent documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check handbook, skills and task graph
        run: python3 scripts/check_agent_docs.py
      - name: Test documentation validator
        run: python3 -m unittest discover -s tests/docs -v
