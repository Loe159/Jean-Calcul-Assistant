name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build, test and analyse Android modules
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Codex companion protocol
        run: |
          python3 -m py_compile companion/codex_companion.py
          PYTHONWARNINGS=error::ResourceWarning python3 -m unittest -v tests.companion.test_codex_companion

      - name: Build project and verify Core and Power User variants
        run: ./gradlew --no-daemon build assembleCoreDebug assemblePowerUserDebug

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Compile Baseline Profile and Macrobenchmark tests
        run: >-
          ./gradlew --no-daemon
          :baseline-profile:assembleCoreBenchmarkRelease
          :baseline-profile:assemblePowerUserBenchmarkRelease

      - name: Run ktlint, Detekt and Android Lint
        run: ./gradlew --no-daemon ktlintCheck detekt lint lintCoreDebug lintPowerUserDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: jean-calcul-debug-apks
          path: android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/outputs/androidTest-results/**
            **/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: ignore
