name: Jean-Calcul V2 - FULL Android validation (independent from preview)
on:
  pull_request:
    branches: [feat/v2-now-brief-pr69, feature/jean-calcul-v2-foundation]
    paths:
      - '.github/workflows/notification-full-validation.yml'
      - '.github/workflows/notification-user-preview.yml'
      - 'app/src/**'
      - 'native/notification-tokenizer/**'
      - 'e2e/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notification-full-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    name: Full Android 35 E2E + JVM tests + lint (does not block preview)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" "ndk;30.0.16248370"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Reuse native tokenizer build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/notification-tokenizer/target
          key: ${{ runner.os }}-jc-tokenizer-emulator-${{ hashFiles('native/notification-tokenizer/Cargo.toml', 'native/notification-tokenizer/src/**') }}
      - name: Build native tokenizer for AVD
        run: |
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang"
          cargo build --release --manifest-path native/notification-tokenizer/Cargo.toml --target x86_64-linux-android
          mkdir -p app/src/main/jniLibs/x86_64
          cp native/notification-tokenizer/target/x86_64-linux-android/release/libjeancalcul_hf_tokenizer.so app/src/main/jniLibs/x86_64/
      - name: Set up isolated Android emulator and run technical e2e
        run: |
          sudo chmod a+rw /dev/kvm
          python3 e2e/run.py --run-id notifications_modes23 --attempt 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JeanCalcul-Filtering-V2-E2E-${{ github.sha }}
          path: |
            e2e-artifacts/notifications_modes23/attempt-1/screenshots/**
            e2e-artifacts/notifications_modes23/attempt-1/test-results/**
            e2e-artifacts/notifications_modes23/attempt-1/logs/*.txt
            e2e-artifacts/notifications_modes23/attempt-1/report.*
            e2e-artifacts/notifications_modes23/attempt-1/visual-review.json
            e2e-artifacts/notifications_modes23/attempt-1/index.html
          if-no-files-found: warn
