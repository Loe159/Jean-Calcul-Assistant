name: V2 Notification ONNX Android POC
on:
  pull_request:
    branches: [feature/jean-calcul-v2-foundation]
    paths:
      - '.github/workflows/notification-onnx-poc.yml'
      - 'native/notification-tokenizer/**'
      - 'app/build.gradle.kts'
      - 'app/src/androidTest/assets/notification_nli_reference.json'
      - 'app/src/androidTest/kotlin/io/github/mangi/eta/agent/device/notifications/**'
      - 'app/src/main/kotlin/io/github/mangi/eta/agent/device/notifications/**'
permissions:
  contents: read
jobs:
  android-onnx-smoke:
    name: ONNX parity on isolated Android 35 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - name: Install Android 37 toolchain
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Install Android NDK for Rust JNI
        run: sdkmanager --channel=3 "ndk;30.0.16248370"
      - name: Build official tokenizers JNI library for x86_64 emulator
        run: |
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang"
          cargo build --release --manifest-path native/notification-tokenizer/Cargo.toml --target x86_64-linux-android
          mkdir -p app/src/main/jniLibs/x86_64
          cp native/notification-tokenizer/target/x86_64-linux-android/release/libjeancalcul_hf_tokenizer.so app/src/main/jniLibs/x86_64/
      - name: Get immutable model (development CI only; no real notifications)
        run: |
          mkdir -p "$RUNNER_TEMP/notification-model"
          curl --fail --location --retry 3 --connect-timeout 30 \
            --output "$RUNNER_TEMP/notification-model/model_quantized.onnx" \
            "https://huggingface.co/Horizon-Labs/multilingual-zeroshot-small/resolve/17af5f8a728d101ce33a9bffad227b0cd005e95e/onnx/model_quantized.onnx"
          echo "0ac394942a086fb1c02beb0fde0357bf7f3bd739ca07af7fa6c9fa11c9c05512  $RUNNER_TEMP/notification-model/model_quantized.onnx" | sha256sum -c -
          curl --fail --location --retry 3 --connect-timeout 30 \
            --output "$RUNNER_TEMP/notification-model/tokenizer.json" \
            "https://huggingface.co/Horizon-Labs/multilingual-zeroshot-small/resolve/17af5f8a728d101ce33a9bffad227b0cd005e95e/tokenizer.json"
          echo "aebee76d0312011b0d73b08a255d4d11d25c83e9639324870c7b916ea102e13e  $RUNNER_TEMP/notification-model/tokenizer.json" | sha256sum -c -
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8192M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            ./gradlew --no-daemon -Pjeancalcul.emulator=true :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb push "$RUNNER_TEMP/notification-model/model_quantized.onnx" /data/local/tmp/notification-onnx-test.onnx
            adb shell 'run-as fr.loevan.jeancalcul.v2 mkdir -p files/notification-model'
            adb shell 'cat /data/local/tmp/notification-onnx-test.onnx | run-as fr.loevan.jeancalcul.v2 sh -c "cat > files/notification-model/model_quantized.onnx"'
            adb shell 'run-as fr.loevan.jeancalcul.v2 ls -l files/notification-model/model_quantized.onnx'
            adb shell rm /data/local/tmp/notification-onnx-test.onnx
            adb push "$RUNNER_TEMP/notification-model/tokenizer.json" /data/local/tmp/notification-tokenizer-test.json
            adb shell 'cat /data/local/tmp/notification-tokenizer-test.json | run-as fr.loevan.jeancalcul.v2 sh -c "cat > files/notification-model/tokenizer.json"'
            adb shell 'run-as fr.loevan.jeancalcul.v2 ls -l files/notification-model/tokenizer.json'
            adb shell rm /data/local/tmp/notification-tokenizer-test.json
            adb shell am instrument -w -r -e class io.github.mangi.eta.agent.device.notifications.NotificationOnnxAndroidPocTest,io.github.mangi.eta.agent.device.notifications.AndroidHfTokenizerParityTest,io.github.mangi.eta.agent.device.notifications.LocalNotificationModelIntegrationTest fr.loevan.jeancalcul.v2.test/androidx.test.runner.AndroidJUnitRunner | tee notification-onnx-instrumentation.txt
            grep -q 'OK (3 tests)' notification-onnx-instrumentation.txt
            grep -q 'HF_TOKENIZER_ANDROID_POC' notification-onnx-instrumentation.txt
            adb logcat -d -s System.out:I '*:S' > notification-onnx-logcat.txt || true
      - name: Upload POC test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V2-Notification-ONNX-Android-POC-${{ github.sha }}
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            notification-onnx-instrumentation.txt
            notification-onnx-logcat.txt
          if-no-files-found: warn
          retention-days: 21
