name: Jean-Calcul V2 - Test intelligent notifications and publish APK
on:
  push:
    branches: [feat/v2-notification-onnx-poc]
permissions:
  contents: read
concurrency:
  group: notification-v2-preview
  cancel-in-progress: false
jobs:
  build:
    name: Build signed ARM64 APK and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Build audited native tokenizer (ARM64)
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          cargo build --locked --release --manifest-path native/notification-tokenizer/Cargo.toml --target aarch64-linux-android
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native/notification-tokenizer/target/aarch64-linux-android/release/libjeancalcul_hf_tokenizer.so app/src/main/jniLibs/arm64-v8a/
      - name: Assign increasing preview version
        id: version
        run: |
          code=$((2030011500 + GITHUB_RUN_NUMBER))
          test "$code" -gt 2030011301
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Build APK + Android instrumented APK + unit tests + lint
        run: |
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 scripts/check-product-text.py
          ./gradlew --no-daemon -Pjeancalcul.versionCode=${{ steps.version.outputs.code }} :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Validate package, architecture and signing
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "name='fr.loevan.jeancalcul.v2'"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "versionCode='${{ steps.version.outputs.code }}'"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libjeancalcul_hf_tokenizer.so$'
          echo "Native tokenizer included"
      - uses: actions/upload-artifact@v4
        with:
          name: JeanCalcul-Notification-V2-APK-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 21
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JeanCalcul-Notification-V2-Reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
  emulator:
    name: Android 35 e2e screenshot and functional checks
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" "ndk;30.0.16248370"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - name: Build native tokenizer for AVD
        run: |
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android33-clang"
          cargo build --locked --release --manifest-path native/notification-tokenizer/Cargo.toml --target x86_64-linux-android
          mkdir -p app/src/main/jniLibs/x86_64
          cp native/notification-tokenizer/target/x86_64-linux-android/release/libjeancalcul_hf_tokenizer.so app/src/main/jniLibs/x86_64/
      - name: Set up isolated Android emulator and run technical e2e
        run: |
          sudo chmod a+rw /dev/kvm
          python3 e2e/run.py --run-id notifications_onnx --attempt 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JeanCalcul-Notifications-V2-E2E-${{ github.sha }}
          path: |
            e2e-artifacts/notifications_onnx/attempt-1/screenshots/**
            e2e-artifacts/notifications_onnx/attempt-1/test-results/**
            e2e-artifacts/notifications_onnx/attempt-1/logs/*.txt
            e2e-artifacts/notifications_onnx/attempt-1/report.*
            e2e-artifacts/notifications_onnx/attempt-1/visual-review.json
            e2e-artifacts/notifications_onnx/attempt-1/index.html
          if-no-files-found: warn
  publish:
    name: Publish in-app preview; do not merge
    needs: [build, emulator]
    if: github.repository == 'Loe159/Jean-Calcul-Assistant' && github.ref == 'refs/heads/feat/v2-notification-onnx-poc'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_CHANNEL: preview-pr-62
      PREVIEW_VERSION_CODE: ${{ needs.build.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JeanCalcul-Notification-V2-APK-${{ github.sha }}
          path: app/build/outputs/apk/debug
      - name: Publish checked version
        run: python3 scripts/publish-preview.py
      - name: Validate manifest after publishing
        run: |
          gh release download "$UPDATE_CHANNEL" --repo "$GITHUB_REPOSITORY" --pattern update.json --output update.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('update.json'))
          assert d['versionCode']==int(os.environ['PREVIEW_VERSION_CODE'])
          assert d['commit']==os.environ['GITHUB_SHA']
          assert d['channel']=='preview-pr-62'
          print('Published', d['apkUrl'])
          PY
