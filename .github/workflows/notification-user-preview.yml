name: Jean-Calcul V2 - FAST APK preview (build and publish)
on:
  push:
    branches: [feat/v2-notification-onnx-poc, feat/v2-notification-filtering, feat/v2-now-brief-pr69, feat/v2-nowbrief-ux, feat/adaptive-local-notifications-20261118]
    paths:
      - '.github/workflows/notification-user-preview.yml'
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'native/notification-tokenizer/**'
      - 'e2e/**'
      - 'scripts/publish-preview.py'
permissions:
  contents: read
concurrency:
  group: notification-modes-2-3-preview
  cancel-in-progress: true
jobs:
  build:
    name: Compile and validate signed ARM64 APK (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Reuse native tokenizer build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/notification-tokenizer/target
          key: ${{ runner.os }}-jc-tokenizer-arm64-${{ hashFiles('native/notification-tokenizer/Cargo.toml', 'native/notification-tokenizer/src/**') }}
      - name: Build audited native tokenizer (ARM64)
        run: |
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$ANDROID_HOME/ndk/30.0.16248370/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android33-clang"
          cargo build --release --manifest-path native/notification-tokenizer/Cargo.toml --target aarch64-linux-android
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp native/notification-tokenizer/target/aarch64-linux-android/release/libjeancalcul_hf_tokenizer.so app/src/main/jniLibs/arm64-v8a/
      - name: Assign increasing preview version
        id: version
        run: |
          test "$GITHUB_RUN_ATTEMPT" -lt 10
          code=$((2030011600 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          test "$code" -gt 2030011510
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Compile installable APK (no emulator or lint gate)
        run: |
          python3 -m unittest discover -s e2e -p 'test_*.py'
          python3 scripts/check-product-text.py
          ./gradlew --no-daemon -Pjeancalcul.versionCode=${{ steps.version.outputs.code }} :app:assembleDebug
      - name: Validate package, architecture and signing
        run: |
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "name='fr.loevan.jeancalcul.v2'"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -F "versionCode='${{ steps.version.outputs.code }}'"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libjeancalcul_hf_tokenizer.so$'
          echo "Native tokenizer included"
      - uses: actions/upload-artifact@v4
        with:
          name: JeanCalcul-Filtering-V2-APK-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 21
          if-no-files-found: error
  publish:
    name: Publish APK immediately after successful build/signature
    needs: [build]
    if: github.repository == 'Loe159/Jean-Calcul-Assistant' && (github.ref == 'refs/heads/feat/v2-notification-filtering' || github.ref == 'refs/heads/feat/v2-nowbrief-ux' || github.ref == 'refs/heads/feat/v2-now-brief-pr69' || github.ref == 'refs/heads/feat/adaptive-local-notifications-20261118')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_CHANNEL: preview-pr-62
      PREVIEW_VERSION_CODE: ${{ needs.build.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JeanCalcul-Filtering-V2-APK-${{ github.sha }}
          path: app/build/outputs/apk/debug
      - name: Publish signed development preview (E2E validated separately)
        run: python3 scripts/publish-preview.py
      - name: Validate manifest after publishing
        run: |
          gh release download "$UPDATE_CHANNEL" --repo "$GITHUB_REPOSITORY" --pattern update.json --output update.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('update.json'))
          assert d['versionCode']==int(os.environ['PREVIEW_VERSION_CODE'])
          assert d['commit']==os.environ['GITHUB_SHA']
          assert d['channel']=='preview-pr-62'
          print('Published', d['apkUrl'])
          PY
