name: Jean-Calcul Now Brief - publish compiled glass preview
on:
  push:
    branches: [feat/v2-now-brief-pr69]
    paths: ['.github/workflows/nowbrief-quick-glass-preview.yml']
permissions:
  actions: read
  contents: write
jobs:
  publish:
    name: Publish signed glassmorphism preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: now-brief-preview-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_CHANNEL: preview-pr-62
      APK_SOURCE_COMMIT: 0dfead5682fa50f3b9e3fe8d27bf26732537c05c
      SOURCE_RUN_ID: '43963673304'
    steps:
      - uses: actions/checkout@v4
      - name: Confirm source build passed
        shell: bash
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.head_sha')" = "$APK_SOURCE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Build signed ARM64 APK and test") | .conclusion' \
            | grep -qx success
      - name: Download compiled ARM64 APK from successful build
        uses: actions/download-artifact@v4
        with:
          repository: Loe159/Jean-Calcul-Assistant
          run-id: '43963673304'
          github-token: ${{ github.token }}
          name: JeanCalcul-Filtering-V2-APK-0dfead5682fa50f3b9e3fe8d27bf26732537c05c
          path: app/build/outputs/apk/debug
      - uses: android-actions/setup-android@v4
      - name: Verify APK provenance, version, and signature
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0" >/dev/null
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f -print -quit)"
          test -n "$APK"
          test "$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          echo "$BADGING" | grep -F "name='fr.loevan.jeancalcul.v2'"
          RUN_NUMBER="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID" --jq '.run_number')"
          EXPECTED_CODE="$((2030011600 + RUN_NUMBER))"
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_CODE'"
          echo "PREVIEW_VERSION_CODE=$EXPECTED_CODE" >> "$GITHUB_ENV"
          unzip -Z1 "$APK" | grep -q '^lib/arm64-v8a/libjeancalcul_hf_tokenizer.so$'
      - name: Publish test preview in Jean-Calcul update channel
        run: python3 scripts/publish-preview.py
      - name: Verify update manifest
        shell: bash
        run: |
          gh release download "$UPDATE_CHANNEL" --repo "$GITHUB_REPOSITORY" --pattern update.json --output published-update.json
          python3 - <<'PY'
          import json, os
          manifest = json.load(open("published-update.json"))
          assert manifest["commit"] == os.environ["APK_SOURCE_COMMIT"], manifest
          assert manifest["versionCode"] == int(os.environ["PREVIEW_VERSION_CODE"]), manifest
          assert manifest["channel"] == "preview-pr-62", manifest
          print("Published APK:", manifest["apkUrl"])
          PY
