name: Repository branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repo-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete audited obsolete branches
        shell: bash
        run: |
          branches=(
            "agent/design-reference-import"
            "agent/fix-jean-calcul-name"
            "codex/ajouter-des-tests-d-integration-complet"
            "codex/compiler-le-projet-et-pousser-l-apk"
            "codex/creer-une-application-d-assistant-personnel-open-source"
            "codex/finaliser-l-implementation-de-la-phase-1"
            "codex/implement-glassmorphism-ui"
            "codex/implementer-la-2e-partie"
            "codex/issue-20-voice-pipeline"
            "codex/issue-21-provider-contracts"
            "codex/issue-27-tool-registry"
            "codex/phase-0-validation-closeout"
            "codex/samsung-power-invocation"
            "core-ui"
            "master"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            fi
          done
