name: Jean-Calcul V2 - APK and Android E2E
on:
  push:
    branches: [feature/jean-calcul-v2-foundation]
  pull_request:
    branches: [feature/jean-calcul-v2-foundation]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    name: Build APK, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0"
      - name: Compile Android Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JeanCalcul-V2-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 21
      - name: Build instrumentation and run lint/unit tests
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V2-Build-Reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn

  emulator:
    name: Instrumentation + synthetic visual review (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      E2E_SYNTHETIC_ONLY: 'true'
      E2E_VISION_MODEL: gpt-4.1-mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0"
      - name: Install visual detector dependencies
        run: python3 -m pip install -r e2e/requirements.txt
      - name: Prove intentional visual regression is detected
        run: python3 e2e/test_visual_diff.py
      - name: Instrumentation and ADB multi-state captures
        id: emulator_tests
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p e2e-artifacts/captures
            if ./gradlew --no-daemon :app:connectedDebugAndroidTest; then
              echo PASS > e2e-artifacts/instrumentation.txt
            else
              echo FAIL > e2e-artifacts/instrumentation.txt
            fi
            adb pull /sdcard/Android/data/fr.loevan.jeancalcul.v2/files/e2e/. e2e-artifacts/captures/ || true
            bash e2e/capture_variants.sh
      - name: Structured report and optional vision API
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p e2e-artifacts/captures
          RESULT=NOT_RUN
          if [ -f e2e-artifacts/instrumentation.txt ]; then RESULT=$(cat e2e-artifacts/instrumentation.txt); fi
          python3 e2e/review.py --captures e2e-artifacts/captures --out e2e-artifacts --instrumentation "$RESULT"
      - name: Upload E2E evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V2-Android-E2E-${{ github.sha }}
          path: |
            e2e-artifacts/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 21
      - name: Fail if Android instrumentation failed
        if: always()
        run: test "${{ steps.emulator_tests.outcome }}" = success && test "$(cat e2e-artifacts/instrumentation.txt)" = PASS
