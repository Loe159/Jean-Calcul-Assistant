name: Jean-Calcul V2 - APK preview
on:
  push:
    branches: [feature/jean-calcul-v2-foundation, feat/eta-selected-features, self-improve/**]
  pull_request:
    branches: [feature/jean-calcul-v2-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build APK, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      preview_version_code: ${{ steps.version.outputs.code }}
    permissions:
      contents: read
    concurrency:
      group: preview-pr-62-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      UPDATE_CHANNEL: preview-pr-62
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      # setup-gradle only writes its cache from the default branch by default, and this workflow never runs there:
      # every build started cold. Write it from these branches too (GitHub scopes caches per branch).
      # 'basic' is the open-source GitHub Actions cache; v6's default provider is a proprietary component.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false
      - name: Test preview publishing scripts
        run: python3 -m unittest discover -s e2e -p 'test_*.py'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Set monotonic preview version
        id: version
        run: |
          test "$GITHUB_RUN_ATTEMPT" -lt 100
          code=$((2030000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "PREVIEW_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Check English product text
        run: python3 scripts/check-product-text.py
      # Robolectric's native runtime bundles SQLite 3.32.2 (no json_valid, no DROP COLUMN). Local Nix JDKs already
      # link a recent libsqlite3 whose symbols take precedence, so tests pass there and failed here since 2026-11-20.
      # Preload the runner's libsqlite3 so CI runs the same SQLite generation as local builds.
      - name: Use the runner's SQLite for Robolectric
        run: |
          lib=/usr/lib/x86_64-linux-gnu/libsqlite3.so.0
          version=$(LD_PRELOAD=$lib python3 -c 'import sqlite3; print(sqlite3.sqlite_version)')
          echo "Runner SQLite $version"
          python3 -c "import sys; v=tuple(map(int, '$version'.split('.'))); sys.exit(0 if v >= (3, 38, 0) else 1)"
          echo "LD_PRELOAD=$lib" >> "$GITHUB_ENV"
      # One Gradle invocation: configuration and dependency resolution happen once; the build cache reuses task
      # outputs restored by setup-gradle.
      - name: Compile Android Debug APK, run unit tests and lint
        run: ./gradlew --no-daemon --build-cache -Pjeancalcul.versionCode="$PREVIEW_VERSION_CODE" :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: JeanCalcul-V2-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 21
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: V2-Build-Reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn

  publish:
    name: Publish verified in-app update
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feature/jean-calcul-v2-foundation' || github.ref == 'refs/heads/feat/eta-selected-features' || startsWith(github.ref, 'refs/heads/self-improve/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: preview-channel-publish
      cancel-in-progress: false
    env:
      UPDATE_CHANNEL: preview-pr-62
      GH_TOKEN: ${{ github.token }}
      PREVIEW_VERSION_CODE: ${{ needs.build.outputs.preview_version_code }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: JeanCalcul-V2-${{ github.sha }}
          path: app/build/outputs/apk/debug
      - name: Publish APK and update manifest
        run: python3 scripts/publish-preview.py
