name: Jean-Calcul V2 - APK and Android E2E
on:
  push:
    branches: [feature/jean-calcul-v2-foundation]
  pull_request:
    branches: [feature/jean-calcul-v2-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build APK, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0"
      - name: Compile Android Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JeanCalcul-V2-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 21
      - name: Build instrumentation and run lint/unit tests
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V2-Build-Reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
  emulator:
    name: Instrumented Android 35 tests and screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            adb shell am start -n fr.loevan.jeancalcul.v2/.MainActivity
            sleep 3
            mkdir -p e2e-artifacts
            adb exec-out screencap -p > e2e-artifacts/home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V2-Android-E2E-${{ github.sha }}
          path: |
            e2e-artifacts/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 21
