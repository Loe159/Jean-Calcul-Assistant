name: Jean-Calcul V2 - APK and Android E2E
on:
  push:
    branches: [feature/jean-calcul-v2-foundation]
  pull_request:
    branches: [feature/jean-calcul-v2-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build APK, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test evidence reporting safeguards
        run: python3 -m unittest discover -s e2e -p 'test_*.py'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Compile Android Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: JeanCalcul-V2-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 21
      - name: Build instrumentation and run lint/unit tests
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V2-Build-Reports-${{ github.sha }}
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: warn
  emulator:
    name: Technical Android 35 E2E (no visual judgment)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test evidence reporting safeguards
        run: python3 -m unittest discover -s e2e -p 'test_*.py'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - name: Install isolated emulator image
        run: sdkmanager "platform-tools" "emulator" "build-tools;37.0.0" "system-images;android-35;google_apis;x86_64"
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - name: Run deterministic technical checks and capture scenarios
        run: python3 e2e/run.py --run-id ci --attempt 1
      - name: Render evidence (visual review stays NOT_RUN)
        if: always()
        run: python3 e2e/report.py e2e-artifacts/ci/attempt-1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V2-Android-E2E-${{ github.sha }}
          path: |
            e2e-artifacts/ci/attempt-1/screenshots/**
            e2e-artifacts/ci/attempt-1/test-results/**
            e2e-artifacts/ci/attempt-1/logs/*.txt
            e2e-artifacts/ci/attempt-1/report.*
            e2e-artifacts/ci/attempt-1/source-manifest.json
            e2e-artifacts/ci/attempt-1/visual-review.json
            e2e-artifacts/ci/attempt-1/index.html
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 21
