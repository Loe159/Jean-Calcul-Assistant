couvrement ; titre Toolbar/PageTitle reste fixe, limite alpha7 documentée.</p></figcaption></figure><figure><a href="screenshots/keyboard.png"><img src="screenshots/keyboard.png" alt="keyboard"></a><figcaption>keyboard: PASS<p>Clavier réellement visible ; en-tête Jean-Calcul et ses trois actions restent peints. Texte saisi et envoi bleu au-dessus du clavier, sans recouvrement.</p></figcaption></figure><figure><a href="screenshots/reduced_motion.png"><img src="screenshots/reduced_motion.png" alt="reduced_motion"></a><figcaption>reduced_motion: PASS<p>État final complet avec indication de saisie et navigation lorsque les animations Android sont désactivées ; une image statique ne juge pas la fluidité.</p></figcaption></figure><figure><a href="screenshots/menu.png"><img src="screenshots/menu.png" alt="menu"></a><figcaption>menu: PASS<p>Menu flottant COUI blanc lisible, deux entrées distinctes ; champ et navigation restent présents en arrière-plan.</p></figcaption></figure><figure><a href="screenshots/gallery.png"><img src="screenshots/gallery.png" alt="gallery"></a><figcaption>gallery: PASS<p>Palette, typographie, deux bulles explicitement illustratives et action dialogue lisibles ; icônes de navigation présentes. Nuancier blanc peu distinct du groupe blanc, limite mineure.</p></figcaption></figure><figure><a href="screenshots/dialog.png"><img src="screenshots/dialog.png" alt="dialog"></a><figcaption>dialog: PASS<p>Dialogue COUI au-dessus du fond assombri, titre et description lisibles ; bouton Fermer large, marges inférieures respectées.</p></figcaption></figure><figure><a href="screenshots/regression_fixture.png"><img src="screenshots/regression_fixture.png" alt="regression_fixture"></a><figcaption>regression_fixture: FAIL<p>Défaut volontaire détecté : grand rectangle rouge opaque en bas, masquant le bas de la capsule, envoi et navigation. État inutilisable.</p></figcaption></figure></main></html>
