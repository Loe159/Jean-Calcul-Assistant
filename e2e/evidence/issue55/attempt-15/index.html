couvrement ; destinations restent distinctes. Toolbar/PageTitle fixes : limite alpha7 documentée.</p></figcaption></figure><figure><a href="screenshots/keyboard.png"><img src="screenshots/keyboard.png" alt="keyboard"></a><figcaption>keyboard: PASS<p>Clavier visible et champ saisi au-dessus avec envoi bleu accessible. En-tête Jean-Calcul et ses trois actions effectivement présents dans le PNG : contrôle natif du recadrage supérieur et de la planche des en-têtes. L’affichage initial de l’image entière avait conduit à une fausse interprétation.</p></figcaption></figure><figure><a href="screenshots/reduced_motion.png"><img src="screenshots/reduced_motion.png" alt="reduced_motion"></a><figcaption>reduced_motion: PASS<p>État final complet, invitation, indication du champ et navigation lisibles ; en-tête confirmé dans les pixels supérieurs. Fluidité non évaluée par une capture.</p></figcaption></figure><figure><a href="screenshots/menu.png"><img src="screenshots/menu.png" alt="menu"></a><figcaption>menu: PASS<p>Menu COUI blanc avec deux entrées espacées, superposé sans masquer la saisie ni la navigation ; actions supérieures présentes.</p></figcaption></figure><figure><a href="screenshots/gallery.png"><img src="screenshots/gallery.png" alt="gallery"></a><figcaption>gallery: PASS<p>Palette bleue et typographie, deux directions de bulles explicitement illustratives et action dialogue lisibles. Navigation et retour présents ; nuancier blanc faiblement distinct du fond blanc, limite mineure.</p></figcaption></figure><figure><a href="screenshots/dialog.png"><img src="screenshots/dialog.png" alt="dialog"></a><figcaption>dialog: PASS<p>Fond assombri et dialogue COUI blanc lisible ; titre, explication et large bouton Fermer sans coupe, barre système séparée.</p></figcaption></figure><figure><a href="screenshots/regression_fixture.png"><img src="screenshots/regression_fixture.png" alt="regression_fixture"></a><figcaption>regression_fixture: FAIL<p>Défaut volontaire détecté : rectangle rouge opaque couvrant le bas de la capsule, la commande envoi et la navigation. Interaction bloquée.</p></figcaption></figure></main></html>
