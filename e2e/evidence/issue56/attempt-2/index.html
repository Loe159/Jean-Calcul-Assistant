nshots/keyboard.png" alt="keyboard"></a><figcaption>keyboard: PASS<p>Clavier visible, texte et envoi au-dessus de l’IME. En-tête Jean-Calcul et trois actions confirmés par ouverture native du recadrage inspection/keyboard-header.png ; aucune disparition.</p></figcaption></figure><figure><a href="screenshots/reduced_motion.png"><img src="screenshots/reduced_motion.png" alt="reduced_motion"></a><figcaption>reduced_motion: PASS<p>État stable lisible avec échelle animation à zéro ; capture ne prouve pas la fluidité ni l’haptique.</p></figcaption></figure><figure><a href="screenshots/menu.png"><img src="screenshots/menu.png" alt="menu"></a><figcaption>menu: PASS<p>Menu COUI ancré sous les options, deux entrées lisibles sans recouvrir la saisie.</p></figcaption></figure><figure><a href="screenshots/gallery.png"><img src="screenshots/gallery.png" alt="gallery"></a><figcaption>gallery: PASS<p>Palette et bulles illustratives clairement présentées ; bouton dialogue visible et navigation dégagée.</p></figcaption></figure><figure><a href="screenshots/dialog.png"><img src="screenshots/dialog.png" alt="dialog"></a><figcaption>dialog: PASS<p>Dialogue COUI au-dessus du fond assombri ; titre, message et bouton Fermer lisibles dans les insets.</p></figcaption></figure><figure><a href="screenshots/provider_dark.png"><img src="screenshots/provider_dark.png" alt="provider_dark"></a><figcaption>provider_dark: FAIL<p>FAIL : champs vides sans contours sur fond de carte sombre, zones éditables peu identifiables. Bouton Enregistrer contrasté.</p></figcaption></figure><figure><a href="screenshots/provider_small_screen.png"><img src="screenshots/provider_small_screen.png" alt="provider_small_screen"></a><figcaption>provider_small_screen: FAIL<p>FAIL : les champs vides sans bordure sont indiscernables sur la carte. Formulaire défilable ; bouton Enregistrer plus bas, non inspecté dans cette capture.</p></figcaption></figure><figure><a href="screenshots/provider_large_text.png"><img src="screenshots/provider_large_text.png" alt="provider_large_text"></a><figcaption>provider_large_text: FAIL<p>FAIL : champs vides sans délimitation ; texte agrandi lisible et non superposé, suite sous le pli défilable.</p></figcaption></figure><figure><a href="screenshots/regression_fixture.png"><img src="screenshots/regression_fixture.png" alt="regression_fixture"></a><figcaption>regression_fixture: FAIL<p>FAIL volontaire : grand rectangle rouge opaque au bas masque la majorité de la capsule, l’envoi et la navigation.</p></figcaption></figure></main></html>
