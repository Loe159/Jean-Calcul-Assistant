r abrégé, titre COUI encore visible et à taille fixe (alpha7).</p></figcaption></figure><figure><a href="screenshots/keyboard.png"><img src="screenshots/keyboard.png" alt="keyboard"></a><figcaption>keyboard: PASS<p>Clavier présent ; brouillon, curseur et envoi restent dégagés au-dessus de l’IME. En-tête et trois actions vérifiés aussi dans inspection/keyboard-header.png ouvert nativement.</p></figcaption></figure><figure><a href="screenshots/reduced_motion.png"><img src="screenshots/reduced_motion.png" alt="reduced_motion"></a><figcaption>reduced_motion: PASS<p>Capture stable avec animations désactivées : accueil, capsule et onglets lisibles ; la capture ne mesure ni fluidité ni retour tactile.</p></figcaption></figure><figure><a href="screenshots/menu.png"><img src="screenshots/menu.png" alt="menu"></a><figcaption>menu: PASS<p>Menu natif COUI avec Galerie COUI et Préférences lisibles, ancré en haut à droite, saisie non recouverte.</p></figcaption></figure><figure><a href="screenshots/gallery.png"><img src="screenshots/gallery.png" alt="gallery"></a><figcaption>gallery: PASS<p>Carte typographique, palette et deux bulles illustratives distinctes ; dialogue accessible dans la zone visible, navigation séparée.</p></figcaption></figure><figure><a href="screenshots/dialog.png"><img src="screenshots/dialog.png" alt="dialog"></a><figcaption>dialog: PASS<p>Dialogue au bas, titre/message/Fermer lisibles sur fond blanc ; voile de fond et barre système distincts, aucune action sous le geste système.</p></figcaption></figure><figure><a href="screenshots/provider_dark.png"><img src="screenshots/provider_dark.png" alt="provider_dark"></a><figcaption>provider_dark: PASS<p>Correction visible : les trois champs vides sont bordés en gris clair sur surface sombre. Libellés et avertissement HTTPS lisibles ; suite et Enregistrer sous le pli non validés par ce PNG.</p></figcaption></figure><figure><a href="screenshots/provider_small_screen.png"><img src="screenshots/provider_small_screen.png" alt="provider_small_screen"></a><figcaption>provider_small_screen: PASS<p>Correction visible en clair sur 360×640 : URL, modèle et clé ont des contours nets. Éléments visibles sans débordement horizontal ; bas de formulaire hors viewport défilable, non inspecté ici.</p></figcaption></figure><figure><a href="screenshots/provider_large_text.png"><img src="screenshots/provider_large_text.png" alt="provider_large_text"></a><figcaption>provider_large_text: PASS<p>À 200 % les champs URL et modèle conservent des bordures visibles, les libellés se réorganisent sans se chevaucher. Le champ clé et la suite sont sous le pli ; leur affichage après défilement reste NOT_RUN.</p></figcaption></figure><figure><a href="screenshots/regression_fixture.png"><img src="screenshots/regression_fixture.png" alt="regression_fixture"></a><figcaption>regression_fixture: FAIL<p>Défaut volontaire détecté : rectangle rouge opaque sur toute la largeur basse masque statut, envoi et navigation, et une partie de la capsule.</p></figcaption></figure></main></html>
